<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newton Microservice => BaseLink</title>
    <!-- #include virtual="/imports.html" -->
    <be-hive>
        <script type=emc-parser 
                src="be-hive/parsers/parse-pattern-statements.js" 
                parser-name=parse-pattern-statements></script>
        <script type=emc 
                src="fetch-for/emc.json" 
                wait-for-parsers=parse-pattern-statements></script>
    </be-hive>
    <script type=module>
        import 'be-hive/be-hive.js';
        import 'be-reformable/emc.js';
        import '@power-elements/json-viewer/json-viewer.js';
    </script>
</head>
<body>
    <link id=newton-microservice rel=preconnect href=https://newton.now.sh/ >
    <form id=form be-reformable='{
        "baseLink": "newton-microservice",
        "path": "api/v2/:operation/:expression"
    }'
        fetch-for=#json-viewer?.object
    >
    <label>
        Operation:
        <input :operation value=integrate>
    </label>
    
    <label>
        Expression:
        <input :expression value="x^2">
    </label>
        <input name="hello" value=test>
    </form>
    <json-viewer id=json-viewer></json-viewer>
</body>
</html>
